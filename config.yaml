github:
  owner: ''
  repo: daily-paper-reader
arxiv_paper_setting:
  mode: standard
  days_window: 9
  docs_dir: docs
  prefer_supabase_read: true
supabase:
  enabled: true
  url: https://lyucdwgefyfbmaiopjbk.supabase.co
  anon_key: sb_publishable_lX-oi64Uxyd7SIVv3_w2Uw_MTOojeKq
  papers_table: arxiv_papers
  use_vector_rpc: true
  vector_rpc: match_arxiv_papers
  vector_rpc_ann: match_arxiv_papers
  vector_rpc_exact: match_arxiv_papers_exact
  use_bm25_rpc: true
  bm25_rpc: match_arxiv_papers_bm25
  sync_table: arxiv_sync_status
  sync_success_value: success
  schema: public
subscriptions:
  schema_migration:
    stage: A
    diff_threshold_pct: 15
  keyword_recall_mode: or
  intent_profiles:
    - tag: driving
      description: >-
        请检索自动驾驶领域的最新论文，关注端到端自动驾驶、感知预测规划一体化、
        自动驾驶世界模型、世界—动作建模、驾驶场景生成与仿真、运动预测、轨迹规划、
        驾驶决策与闭环控制，以及服务于自动驾驶的多模态基础模型、视觉语言模型和推理方法。
        优先返回在自动驾驶数据集、驾驶仿真、公开评测基准或真实车辆系统中验证，
        且在模型架构、训练方法、数据规模、评测或系统能力上具有代表性或创新性的工作。
      enabled: true
      paper_sources:
        - arxiv
      keywords:
        - keyword: autonomous driving
          keyword_cn: 自动驾驶
          query: autonomous driving systems, datasets, benchmarks, and real-world deployment
        - keyword: end-to-end autonomous driving
          keyword_cn: 端到端自动驾驶
          query: end-to-end autonomous driving integrating perception, prediction, planning, and control
        - keyword: driving world model
          keyword_cn: 驾驶世界模型
          query: world models, latent dynamics, video prediction, and generative simulation for autonomous driving
        - keyword: vision-language-action model for autonomous driving
          keyword_cn: 自动驾驶视觉语言动作模型
          query: vision-language-action models for autonomous driving planning and closed-loop vehicle control
        - keyword: motion prediction for autonomous driving
          keyword_cn: 自动驾驶运动预测
          query: motion prediction, trajectory forecasting, and behavior prediction for autonomous vehicles
        - keyword: trajectory planning for autonomous driving
          keyword_cn: 自动驾驶轨迹规划
          query: trajectory planning, decision making, safety-aware control, and integrated perception prediction planning for autonomous driving
      intent_queries:
        - query: end-to-end autonomous driving, integrated perception prediction planning, decision making, and closed-loop control
          query_cn: 端到端自动驾驶、感知预测规划一体化、驾驶决策与闭环控制
        - query: driving world models, world-action models, video prediction, latent dynamics, and generative simulation for autonomous driving
          query_cn: 用于自动驾驶的世界模型、世界动作模型、视频预测、潜在动力学与生成式仿真
        - query: multimodal foundation models, vision language models, scene understanding, and reasoning methods for autonomous driving
          query_cn: 用于自动驾驶的多模态基础模型、视觉语言模型、场景理解与推理方法
        - query: motion forecasting, behavior prediction, trajectory planning, interactive decision making, and safety-aware vehicle control
          query_cn: 自动驾驶运动预测、行为预测、轨迹规划、交互式决策与安全车辆控制
    - tag: robotics
      description: >-
        请检索机器人与具身智能领域的最新论文，关注视觉语言动作模型、机器人学习、
        机器人操作与导航、动作生成、具身感知与推理、机器人世界模型与世界—动作建模、
        强化学习、策略优化、连续控制和仿真到真实迁移。
        优先返回在机器人数据集、仿真环境、公开评测基准或真实机器人系统中验证，
        且在模型架构、训练方法、数据、评测或实际部署方面具有代表性或创新性的工作。
      enabled: true
      paper_sources:
        - arxiv
      keywords:
        - keyword: robotics
          keyword_cn: 机器人
          query: foundation models, learning methods, datasets, and benchmarks for robotics
        - keyword: vision-language-action model
          keyword_cn: 视觉语言动作模型
          query: vision-language-action models for robot manipulation, navigation, and control
        - keyword: robot manipulation
          keyword_cn: 机器人操作
          query: robot manipulation, grasping, dexterous manipulation, and action generation
        - keyword: embodied intelligence
          keyword_cn: 具身智能
          query: embodied intelligence with perception, reasoning, memory, and action loops for robots
        - keyword: world action model
          keyword_cn: 世界动作模型
          query: world models, world-action models, latent dynamics, and predictive modeling for robot learning and planning
        - keyword: reinforcement learning for robotics
          keyword_cn: 机器人强化学习
          query: reinforcement learning, imitation learning, policy optimization, and continuous control for robotics
      intent_queries:
        - query: vision language action models, embodied AI, robot learning, action generation, manipulation, navigation, and control
          query_cn: 视觉语言动作模型、具身智能、机器人学习、动作生成、操作、导航与控制
        - query: world models, video prediction, latent dynamics, representation learning, world action models, reinforcement learning, and policy optimization for robotics
          query_cn: 面向机器人的世界模型、视频预测、潜在动力学、表征学习、世界动作模型、强化学习与策略优化
        - query: multimodal foundation models, vision language models, reasoning methods, and generalist robot policies for embodied agents
          query_cn: 面向具身智能体的多模态基础模型、视觉语言模型、推理方法与通用机器人策略
        - query: robot manipulation, tactile and visual perception, long-horizon planning, continuous control, and sim-to-real transfer
          query_cn: 机器人操作、触觉与视觉感知、长时程规划、连续控制与仿真到真实迁移
source_backends:
  arxiv:
    kind: supabase
    enabled: true
    url: https://lyucdwgefyfbmaiopjbk.supabase.co
    anon_key: sb_publishable_lX-oi64Uxyd7SIVv3_w2Uw_MTOojeKq
    schema: public
    papers_table: arxiv_papers
    use_vector_rpc: true
    vector_rpc: match_arxiv_papers_exact
    vector_rpc_exact: match_arxiv_papers_exact
    use_bm25_rpc: true
    bm25_rpc: match_arxiv_papers_bm25
    sync_table: arxiv_sync_status
    sync_success_value: success
