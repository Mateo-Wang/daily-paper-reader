name: ai-frontier-daily-collector

on:
  schedule:
    # Daily 09:10 Beijing time (01:10 UTC): collect candidates every day.
    # Monday's run additionally makes the sparse weekly selection.
    - cron: "10 1 * * *"
  workflow_dispatch:
    inputs:
      week:
        description: "ISO week (e.g. 2026-W31); blank = current UTC ISO week"
        required: false
        default: ""
      collect_only:
        description: "Only refresh the 30-day candidate pool; do not publish a weekly selection"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: ai-frontier-weekly
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
      # Optional JSON arrays, configured as repository secrets or variables.
      # RSS object example: [{"name":"DeepMind","url":"https://…/feed.xml","type":"技术报告"}]
      FRONTIER_RSS_FEEDS: ${{ secrets.FRONTIER_RSS_FEEDS }}
      FRONTIER_X_QUERIES: ${{ secrets.FRONTIER_X_QUERIES }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install small runtime dependency set
        run: python -m pip install --upgrade requests

      - name: Collect and select AI frontier
        run: |
          ARGS=(--window-days 30)
          if [ -n "${{ inputs.week }}" ]; then ARGS+=(--week "${{ inputs.week }}"); fi
          if [ "${{ inputs.collect_only }}" = "true" ]; then ARGS+=(--collect-only); fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then
            ARGS+=(--collect-only)
          fi
          python src/frontier.py "${ARGS[@]}"

      - name: Commit generated frontier archive
        run: |
          if git diff --quiet -- docs/frontier docs/README.md docs/_sidebar.md archive/frontier; then
            echo "No frontier changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/frontier docs/README.md docs/_sidebar.md archive/frontier
          git commit -m "chore: refresh weekly AI frontier"
          git push
